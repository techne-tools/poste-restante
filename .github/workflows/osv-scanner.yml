name: OSV-Scanner

# Emitted by agent-dispatch. Full dependency scan on push and weekly.
# Runs the upstream reusable workflow; needs no GitHub Advanced Security to
# the SARIF upload needs GHAS, so it is switched off below.

on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches: [main, master]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-scheduled:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      # The reusable workflow uploads SARIF to the Security tab by default, and
      # that upload fails with "Code scanning is not enabled for this repository"
      # on a private repo without GHAS — reddening the job on every push. The scan
      # itself still fails the job on findings. Flip to true on a repo with GHAS.
      upload-sarif: false
