name: OSV-Scanner

# Emitted by agent-dispatch. Scans lockfiles for known CVEs on push and weekly.
#
# This runs the scanner action directly instead of the upstream reusable
# workflow: the reusable one uploads SARIF to the Security tab, and that upload
# fails on a private repo without GitHub Advanced Security — reddening the job on
# every push regardless of findings. Without a code-scanning surface the findings
# can only land in this log, so the job reports instead of gating
# (continue-on-error). Drop that line on a repo with GHAS, or once the
# dependency backlog is clear and you want it to block.

on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  scan:
    name: Dependency CVEs
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --recursive
            ./ 
