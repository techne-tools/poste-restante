# Poste Restante — raw payload store (MinIO) on the Docker homelab host.
#
# Implements the third tier of the archive spine (SPEC §3.1 / §3.2):
# Postgres (letters) + Qdrant (vectors) + MinIO (raw payloads: audio, images, attachments).
#
# Attaches to backend_net (external: true). The house connects via
# compose service DNS: http://app-minio:9000
#
# Host ports in the 21000 range per AGENTS.md policy. Recon 2026-09-07:
# the originally-doc'd 21018/21019 are taken on horza (immich, vaultwarden)
# — the API publishes on 21035 (probed free); the console is OFF for alpha
# (browser access adds a service without a need; the house's API is the
# test surface). Raise MINIO_PORT_API in .env.public if 21035 later collides.
name: minio

services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: app-minio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - service.owner=chris
    ports:
      - "${MINIO_PORT_API:-21035}:9000"
    networks:
      - backend_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-poste_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BROWSER: ${MINIO_BROWSER:-off}
    # The official image's entrypoint is bare `minio` — it needs the server
    # subcommand or it prints help and exits (crash-loop). Console binds
    # :9001 inside the container; it is not published (browser access off).
    command: ["server", "/data"]
    volumes:
      - minio-data:/data

volumes:
  minio-data:

networks:
  backend_net:
    external: true
