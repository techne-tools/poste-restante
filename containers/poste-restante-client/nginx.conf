# Poste Restante reference client — nginx.
#
# Serves the static bundle and proxies the protocol to the house on
# backend_net. The house remains headless (invariant 1); this is A client
# the operator composed for testers (invariant 2).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enclosure uploads (images, audio) ride the house's 30 MB body limit;
    # nginx's 1 MB default would silently 413 them. Mirror the house.
    client_max_body_size 30m;

    # The protocol — proxied to the house. The house enforces auth itself
    # (Basic via Authorization header, carried through the proxy); nginx
    # stores nothing and adds no visibility of its own.
    location /v1/ {
        proxy_pass http://house:8787/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Enclosure blob downloads stream through unchanged.
        proxy_buffering off;
    }

    # Static assets, then SPA fallback (the client routes by state, not
    # path, but a bare index.html fallback keeps deep links honest).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
